<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Pulse" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#eef0f6" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
<title>Lev's Pulse</title>
<style>
  /* ---------- design tokens ---------- */
  :root {
    --bg-1: #f4f6fb;
    --bg-2: #e7ecf6;
    --bg-3: #dde3ee;
    --ink: #2c3244;
    --ink-soft: #5e6678;
    --ink-faint: #8d97ab;
    --glass-bg: rgba(255,255,255,0.55);
    --glass-border: rgba(255,255,255,0.72);
    --shadow-soft: 0 16px 44px rgba(80,100,140,0.18);
    --shadow-inset:
      inset 0 1px 0 rgba(255,255,255,0.95),
      inset 0 -1px 0 rgba(80,100,140,0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; width: 100%;
    overflow: hidden;
    position: fixed; inset: 0;
    background:
      radial-gradient(140% 110% at 20% -10%, #f7f8fc 0%, #eaeff8 50%, #dde4ef 100%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
    font-size: 16px;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  button, input { font: inherit; color: inherit; border: none; background: none; }
  button { cursor: pointer; }
  input { outline: none; }
  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }

  /* ---------- ambient background blobs ---------- */
  .bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.55; }
  .b1 { width: 380px; height: 380px; background: #d6e0f6; top: -140px; left: -110px;
        animation: float1 22s ease-in-out infinite; }
  .b2 { width: 300px; height: 300px; background: #e6d8f0; top: 38%; right: -100px;
        animation: float2 26s ease-in-out infinite; }
  .b3 { width: 340px; height: 340px; background: #d4ece4; bottom: -140px; left: 18%;
        animation: float3 30s ease-in-out infinite; }
  @keyframes float1 { 0%,100%{transform:translate(0,0);} 50%{transform:translate(40px,30px);} }
  @keyframes float2 { 0%,100%{transform:translate(0,0);} 50%{transform:translate(-30px,-40px);} }
  @keyframes float3 { 0%,100%{transform:translate(0,0);} 50%{transform:translate(24px,-26px);} }

  /* ---------- subtle settings trigger ---------- */
  .settings-trigger {
    position: fixed;
    top: max(env(safe-area-inset-top), 20px);
    right: 18px;
    width: 38px; height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    border: 1px solid rgba(255,255,255,0.6);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    display: none;
    align-items: center; justify-content: center;
    z-index: 10;
    color: var(--ink-faint);
    transition: transform 0.18s, background 0.2s;
    box-shadow: 0 4px 14px rgba(80,100,140,0.10);
  }
  .settings-trigger.visible { display: flex; }
  .settings-trigger:active { transform: scale(0.92); background: rgba(255,255,255,0.65); }
  .settings-trigger svg { width: 16px; height: 16px; fill: currentColor; }

  /* ---------- app & screens ---------- */
  #app { position: relative; width: 100%; height: 100%; z-index: 1; }
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: max(env(safe-area-inset-top), 28px) 26px max(env(safe-area-inset-bottom), 36px);
    opacity: 0; pointer-events: none;
    transform: translateY(12px) scale(0.992);
    transition: opacity 0.7s cubic-bezier(.2,.7,.2,1),
                transform 0.7s cubic-bezier(.2,.7,.2,1);
  }
  .screen.active { opacity: 1; pointer-events: auto; transform: none; }

  /* ---------- typography ---------- */
  .brand {
    font-weight: 200;
    font-size: 30px;
    letter-spacing: -0.025em;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .brand-sub {
    font-size: 13px;
    color: var(--ink-faint);
    letter-spacing: 0.06em;
    text-transform: lowercase;
    margin-bottom: 64px;
  }
  .prompt {
    font-weight: 300;
    font-size: 26px;
    color: var(--ink);
    letter-spacing: -0.02em;
    margin-bottom: 28px;
  }

  /* ---------- decorative mini orb on start ---------- */
  .start-orb {
    width: 130px; height: 130px;
    border-radius: 50%;
    margin-bottom: 36px;
    position: relative;
    background:
      radial-gradient(circle at 36% 30%, #ffffff 0%, #eef2fb 35%, #cfdbef 70%, #a9bcdc 100%);
    box-shadow:
      0 22px 50px rgba(120,140,180,0.30),
      inset 0 1px 1px rgba(255,255,255,0.9),
      inset 0 -16px 24px rgba(120,140,180,0.10);
    animation: breathe 6s ease-in-out infinite;
  }
  .start-orb::before {
    content: '';
    position: absolute;
    top: 14%; left: 22%;
    width: 50%; height: 24%;
    background: radial-gradient(ellipse at center top, rgba(255,255,255,0.9), rgba(255,255,255,0) 70%);
    filter: blur(1px);
    border-radius: 50%;
  }

  /* ---------- inputs ---------- */
  .big-input {
    width: 78%;
    max-width: 320px;
    text-align: center;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.75);
    box-shadow: var(--shadow-soft), var(--shadow-inset);
    border-radius: 22px;
    padding: 20px 20px;
    font-size: 32px;
    font-weight: 300;
    letter-spacing: -0.02em;
    color: var(--ink);
    transition: background 0.25s;
    margin-bottom: 36px;
  }
  .big-input::placeholder { color: var(--ink-faint); font-weight: 200; }
  .big-input:focus { background: rgba(255,255,255,0.72); }
  .big-input.time {
    font-size: 30px;
    text-align: center;
    -webkit-appearance: none;
    appearance: none;
  }

  /* ---------- pill button ---------- */
  .pill {
    position: relative;
    display: inline-flex;
    align-items: center; justify-content: center;
    min-width: 220px;
    padding: 19px 38px;
    border-radius: 999px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.62) 100%);
    border: 1px solid rgba(255,255,255,0.85);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.95),
      inset 0 -1px 0 rgba(80,100,140,0.06),
      0 18px 44px rgba(80,100,140,0.18),
      0 2px 8px rgba(80,100,140,0.08);
    color: var(--ink);
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.01em;
    transition: transform 0.18s cubic-bezier(.2,.7,.2,1),
                filter 0.18s,
                box-shadow 0.2s;
  }
  .pill:active {
    transform: scale(0.965);
    filter: brightness(1.04);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.95),
      inset 0 -1px 0 rgba(80,100,140,0.06),
      0 8px 22px rgba(80,100,140,0.16),
      0 1px 4px rgba(80,100,140,0.06);
  }

  /* ---------- orb (main) ---------- */
  .orb-wrap {
    position: relative;
    width: 280px; height: 280px;
    margin-bottom: 22px;
  }
  .orb {
    position: relative;
    width: 100%; height: 100%;
    animation: breathe 5.8s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes breathe {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.025); }
  }
  .orb-halo {
    position: absolute;
    inset: -34px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(168,188,228,0.40) 0%, rgba(168,188,228,0) 62%);
    filter: blur(10px);
    animation: halopulse 5.8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes halopulse { 0%,100% { opacity: 0.75; } 50% { opacity: 1; } }

  .orb-body {
    position: absolute; inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 38% 30%, rgba(255,255,255,0.96) 0%, rgba(232,239,255,0.78) 30%, rgba(198,212,238,0.55) 65%, rgba(154,172,207,0.38) 100%),
      radial-gradient(circle at 50% 60%, rgba(255,255,255,0) 70%, rgba(110,135,180,0.20) 100%);
    border: 1px solid rgba(255,255,255,0.75);
    box-shadow:
      0 30px 60px rgba(120,140,180,0.28),
      inset 0 1px 1px rgba(255,255,255,0.95),
      inset 0 -22px 30px rgba(120,140,180,0.10);
    overflow: hidden;
  }
  .orb-shimmer {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 24% 22%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 32%);
    animation: shimmer 10s ease-in-out infinite;
    mix-blend-mode: screen;
    pointer-events: none;
  }
  @keyframes shimmer {
    0%,100% { transform: translate(0,0); }
    33% { transform: translate(8px,-4px); }
    66% { transform: translate(-6px,6px); }
  }
  .orb-highlight {
    position: absolute;
    top: 12%; left: 20%;
    width: 60%; height: 26%;
    background: radial-gradient(ellipse at center top, rgba(255,255,255,0.92), rgba(255,255,255,0) 70%);
    filter: blur(2px);
    pointer-events: none;
  }
  .orb-spec {
    position: absolute;
    top: 22%; left: 30%;
    width: 14px; height: 14px;
    background: radial-gradient(circle, #ffffff 0%, rgba(255,255,255,0.0) 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .orb-content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .orb-number {
    font-size: 64px;
    font-weight: 200;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    line-height: 1;
    transition: opacity 0.35s;
  }
  .orb-label {
    margin-top: 8px;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    text-transform: lowercase;
  }

  /* on increment, halo pulses gently */
  .orb.pulse .orb-halo { animation: halopulseFast 1.2s ease-out, halopulse 5.8s ease-in-out infinite 1.2s; }
  @keyframes halopulseFast {
    0%   { opacity: 1; transform: scale(1.04); }
    100% { opacity: 0.75; transform: scale(1); }
  }
  .orb-number.bump { animation: numbump 0.55s cubic-bezier(.3,1.4,.4,1); }
  @keyframes numbump {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); filter: brightness(1.1); }
    100% { transform: scale(1); }
  }
  .orb.dissolve { animation: orbDissolve 1.0s cubic-bezier(.3,.7,.2,1); }
  @keyframes orbDissolve {
    0% { transform: scale(1); }
    35% { transform: scale(1.06); filter: brightness(1.14); }
    100% { transform: scale(1); filter: brightness(1); }
  }

  .orb-ripple {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 2px solid rgba(170,190,230,0.55);
    pointer-events: none;
    animation: ripple 1.1s ease-out forwards;
  }
  @keyframes ripple {
    0% { transform: scale(0.92); opacity: 0.85; }
    100% { transform: scale(1.4); opacity: 0; }
  }

  /* ---------- remaining text ---------- */
  .remaining {
    font-size: 14px;
    color: var(--ink-faint);
    letter-spacing: 0.05em;
    margin-bottom: 38px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- done screen ---------- */
  .check-wrap {
    width: 180px; height: 180px;
    margin-bottom: 32px;
    animation: donePulse 5s ease-in-out infinite;
    filter: drop-shadow(0 18px 40px rgba(120,140,180,0.25));
  }
  @keyframes donePulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.03);} }
  .check-svg { width: 100%; height: 100%; overflow: visible; }
  .check-circle {
    fill: rgba(255,255,255,0.55);
    stroke: rgba(180,200,235,0.55);
    stroke-width: 1.2;
  }
  .check-path {
    fill: none;
    stroke: var(--ink);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 70;
    stroke-dashoffset: 70;
    animation: drawCheck 1.0s 0.2s cubic-bezier(.4,1,.4,1) forwards;
  }
  @keyframes drawCheck { to { stroke-dashoffset: 0; } }
  .done-text {
    font-size: 22px;
    font-weight: 300;
    color: var(--ink);
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }
  .done-sub {
    font-size: 13px;
    color: var(--ink-faint);
    letter-spacing: 0.06em;
  }

  /* ---------- bottom sheets ---------- */
  .sheet-overlay {
    position: fixed; inset: 0;
    background: rgba(20,30,55,0.18);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    z-index: 20;
  }
  .sheet-overlay.show { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed; left: 0; right: 0;
    bottom: 0;
    padding: 20px 24px max(env(safe-area-inset-bottom), 28px);
    background: rgba(255,255,255,0.78);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border-top-left-radius: 34px;
    border-top-right-radius: 34px;
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 -22px 60px rgba(80,100,140,0.20);
    transform: translateY(110%);
    transition: transform 0.5s cubic-bezier(.2,.85,.2,1);
    z-index: 21;
    display: flex; flex-direction: column; align-items: center;
  }
  .sheet.show { transform: translateY(0); }
  .sheet-handle {
    width: 40px; height: 5px;
    border-radius: 999px;
    background: rgba(120,140,180,0.25);
    margin-bottom: 18px;
  }
  .sheet-title {
    font-size: 18px;
    font-weight: 400;
    color: var(--ink);
    margin-bottom: 18px;
    letter-spacing: -0.01em;
  }
  .sheet-input {
    width: 100%;
    max-width: 280px;
    text-align: center;
    font-size: 40px;
    font-weight: 200;
    letter-spacing: -0.03em;
    padding: 14px 16px;
    border-radius: 20px;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: var(--shadow-inset);
    color: var(--ink);
    margin-bottom: 18px;
    font-variant-numeric: tabular-nums;
  }
  .sheet-input::placeholder { color: var(--ink-faint); font-weight: 200; }

  .chips {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .chip {
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.7);
    color: var(--ink-soft);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.01em;
    transition: transform 0.15s, background 0.2s;
  }
  .chip:active { background: rgba(255,255,255,0.9); transform: scale(0.95); }

  .field {
    display: flex; flex-direction: column;
    width: 100%;
    max-width: 320px;
    margin-bottom: 16px;
  }
  .field-label {
    font-size: 12px;
    color: var(--ink-faint);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding-left: 4px;
  }
  .field input {
    padding: 14px 18px;
    border-radius: 16px;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.7);
    font-size: 18px;
    color: var(--ink);
    box-shadow: var(--shadow-inset);
    -webkit-appearance: none;
    appearance: none;
  }

  /* ---------- quick-add buttons (sheet) ---------- */
  .quick-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 300px;
    margin-bottom: 14px;
  }
  .quick {
    padding: 22px 0;
    border-radius: 22px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.6) 100%);
    border: 1px solid rgba(255,255,255,0.8);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.95),
      inset 0 -1px 0 rgba(80,100,140,0.06),
      0 10px 28px rgba(80,100,140,0.14);
    font-size: 22px;
    font-weight: 300;
    letter-spacing: -0.02em;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    transition: transform 0.16s cubic-bezier(.2,.7,.2,1), filter 0.18s;
  }
  .quick:active { transform: scale(0.95); filter: brightness(1.05); }

  .custom-toggle {
    font-size: 13px;
    color: var(--ink-faint);
    padding: 10px 18px;
    letter-spacing: 0.06em;
    text-transform: lowercase;
    margin-bottom: 4px;
    border-radius: 999px;
    transition: color 0.2s, background 0.2s;
  }
  .custom-toggle:active { color: var(--ink); background: rgba(255,255,255,0.45); }

  .custom-area {
    width: 100%;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.45s cubic-bezier(.2,.85,.2,1),
                opacity 0.3s ease,
                margin-top 0.3s ease;
  }
  .custom-area.open {
    max-height: 220px;
    opacity: 1;
    margin-top: 12px;
  }

  /* ---------- logged today (subtle) ---------- */
  .logged {
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.10em;
    opacity: 0.65;
    margin-top: -28px;     /* sit just under "X left" */
    margin-bottom: 14px;   /* preserves original button position */
    font-variant-numeric: tabular-nums;
    text-transform: lowercase;
    transition: opacity 0.4s ease;
  }
  .logged:empty { display: none; }

  /* keep the orb crisp even at narrow widths */
  @media (max-width: 360px) {
    .orb-wrap { width: 240px; height: 240px; }
    .orb-number { font-size: 56px; }
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<button class="settings-trigger" id="btn-settings" aria-label="Settings">
  <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
</button>

<main id="app">

  <!-- Setup: Start -->
  <section id="screen-start" class="screen">
    <div class="start-orb"></div>
    <h1 class="brand">Lev’s Pulse</h1>
    <p class="brand-sub">a quiet ritual</p>
    <button class="pill" id="btn-start">Start Today</button>
  </section>

  <!-- Setup: Goal -->
  <section id="screen-goal" class="screen">
    <p class="prompt">Today Goal</p>
    <input class="big-input" id="input-goal" type="number" inputmode="numeric" min="100" step="100" placeholder="6000" />
    <button class="pill" id="btn-goal-next">Continue</button>
  </section>

  <!-- Setup: Sleep -->
  <section id="screen-sleep" class="screen">
    <p class="prompt">Sleep Time</p>
    <input class="big-input time" id="input-sleep" type="time" />
    <button class="pill" id="btn-sleep-next">Begin</button>
  </section>

  <!-- Main -->
  <section id="screen-main" class="screen">
    <div class="orb-wrap" id="orb-wrap">
      <div class="orb" id="orb">
        <div class="orb-halo"></div>
        <div class="orb-body">
          <div class="orb-shimmer"></div>
          <div class="orb-highlight"></div>
          <div class="orb-spec"></div>
          <div class="orb-content">
            <div class="orb-number" id="pending-num">0</div>
            <div class="orb-label" id="pending-label">calm</div>
          </div>
        </div>
      </div>
    </div>
    <div class="remaining" id="remaining-text">0 left</div>
    <div class="logged" id="logged-text"></div>
    <button class="pill" id="btn-did">I did it</button>
  </section>

  <!-- Done -->
  <section id="screen-done" class="screen">
    <div class="check-wrap">
      <svg class="check-svg" viewBox="0 0 120 120">
        <defs>
          <radialGradient id="checkGrad" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#cfdbef" stop-opacity="0.5"/>
          </radialGradient>
        </defs>
        <circle class="check-circle" cx="60" cy="60" r="52" fill="url(#checkGrad)"/>
        <path class="check-path" d="M40 62 L54 76 L82 46"/>
      </svg>
    </div>
    <p class="done-text">Done for today</p>
    <p class="done-sub">rest well</p>
  </section>

</main>

<!-- Did-it bottom sheet -->
<div class="sheet-overlay" id="sheet-overlay"></div>

<section class="sheet" id="sheet-did" aria-hidden="true">
  <div class="sheet-handle"></div>
  <p class="sheet-title">Log movement</p>
  <div class="quick-grid">
    <button class="quick" data-amount="50">+50</button>
    <button class="quick" data-amount="100">+100</button>
    <button class="quick" data-amount="150">+150</button>
    <button class="quick" data-amount="200">+200</button>
  </div>
  <button class="custom-toggle" id="btn-custom-toggle">custom</button>
  <div class="custom-area" id="custom-area">
    <input class="sheet-input" id="sheet-input" type="number" inputmode="numeric" min="1" placeholder="0" />
    <button class="pill" id="btn-sheet-confirm">Add</button>
  </div>
</section>

<section class="sheet" id="sheet-settings" aria-hidden="true">
  <div class="sheet-handle"></div>
  <p class="sheet-title">Settings</p>
  <div class="field">
    <span class="field-label">Today Goal</span>
    <input type="number" inputmode="numeric" min="100" step="100" id="settings-goal" />
  </div>
  <div class="field">
    <span class="field-label">Sleep Time</span>
    <input type="time" id="settings-sleep" />
  </div>
  <button class="pill" id="btn-settings-save">Save</button>
</section>

<script>
(() => {
  const KEY = 'levspulse.v1';

  const els = {
    screens: {
      start: document.getElementById('screen-start'),
      goal:  document.getElementById('screen-goal'),
      sleep: document.getElementById('screen-sleep'),
      main:  document.getElementById('screen-main'),
      done:  document.getElementById('screen-done'),
    },
    btnStart: document.getElementById('btn-start'),
    inputGoal: document.getElementById('input-goal'),
    btnGoalNext: document.getElementById('btn-goal-next'),
    inputSleep: document.getElementById('input-sleep'),
    btnSleepNext: document.getElementById('btn-sleep-next'),

    orbWrap: document.getElementById('orb-wrap'),
    orb: document.getElementById('orb'),
    pendingNum: document.getElementById('pending-num'),
    pendingLabel: document.getElementById('pending-label'),
    remainingText: document.getElementById('remaining-text'),
    loggedText: document.getElementById('logged-text'),
    btnDid: document.getElementById('btn-did'),

    sheetOverlay: document.getElementById('sheet-overlay'),
    sheetDid: document.getElementById('sheet-did'),
    sheetInput: document.getElementById('sheet-input'),
    quickButtons: document.querySelectorAll('#sheet-did .quick'),
    btnCustomToggle: document.getElementById('btn-custom-toggle'),
    customArea: document.getElementById('custom-area'),
    btnSheetConfirm: document.getElementById('btn-sheet-confirm'),

    btnSettings: document.getElementById('btn-settings'),
    sheetSettings: document.getElementById('sheet-settings'),
    settingsGoal: document.getElementById('settings-goal'),
    settingsSleep: document.getElementById('settings-sleep'),
    btnSettingsSave: document.getElementById('btn-settings-save'),
  };

  const defaults = {
    setupDone: false,
    goal: 6000,
    sleep: '00:00',
    date: null,
    loggedToday: 0,
    pending: 0,
    lastUpdate: Date.now()
  };

  let state = load();
  let isAnimating = false;
  let lastDisplayed = -1;
  let currentScreen = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      const parsed = raw ? JSON.parse(raw) : {};
      // migrate legacy 'done' → 'loggedToday'
      if ('done' in parsed && !('loggedToday' in parsed)) {
        parsed.loggedToday = parsed.done;
        delete parsed.done;
      }
      return Object.assign({}, defaults, parsed);
    } catch { return Object.assign({}, defaults); }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function ensureFreshDay() {
    const today = todayStr();
    if (state.date !== today) {
      state.date = today;
      state.loggedToday = 0;
      state.pending = 0;
      state.lastUpdate = Date.now();
      state.setupDone = false;
      save();
      return true;
    }
    return false;
  }

  function getSleepTimestamp() {
    const [h, m] = (state.sleep || '00:00').split(':').map(Number);
    const t = new Date();
    t.setHours(h || 0, m || 0, 0, 0);
    if (t.getTime() <= Date.now()) t.setTime(t.getTime() + 24*60*60*1000);
    return t.getTime();
  }

  function tick() {
    const now = Date.now();
    const dt = Math.max(0, (now - state.lastUpdate) / 1000);
    state.lastUpdate = now;
    if (dt === 0) return;

    const remaining = Math.max(0, state.goal - state.loggedToday);
    if (remaining <= 0) { state.pending = 0; save(); return; }

    const sleepTs = getSleepTimestamp();
    const awakeSec = (sleepTs - now) / 1000;
    if (awakeSec <= 0) { save(); return; }

    const ratePerSec = remaining / awakeSec;
    state.pending = Math.min(remaining, state.pending + ratePerSec * dt);
    save();
  }

  function showScreen(name) {
    if (currentScreen === name) return;
    currentScreen = name;
    Object.entries(els.screens).forEach(([n, el]) => {
      el.classList.toggle('active', n === name);
    });
    // Show settings only on main + done screens
    els.btnSettings.classList.toggle('visible', name === 'main' || name === 'done');
  }

  function showSheet(sheetEl) {
    els.sheetOverlay.classList.add('show');
    sheetEl.classList.add('show');
    sheetEl.setAttribute('aria-hidden', 'false');
  }
  function hideSheets() {
    els.sheetOverlay.classList.remove('show');
    [els.sheetDid, els.sheetSettings].forEach(s => {
      s.classList.remove('show');
      s.setAttribute('aria-hidden', 'true');
    });
    // blur to dismiss keyboard
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
  }

  function render(opts = {}) {
    const pending = Math.floor(state.pending);
    const remaining = Math.max(0, state.goal - state.loggedToday);

    if (!isAnimating) {
      if (pending !== lastDisplayed) {
        if (pending > 0) {
          els.pendingNum.textContent = '+' + pending;
          els.pendingLabel.textContent = 'waiting';
        } else {
          els.pendingNum.textContent = '0';
          els.pendingLabel.textContent = remaining > 0 ? 'calm' : 'still';
        }
        if (lastDisplayed >= 0 && pending > lastDisplayed && !opts.silent) {
          // soft pulse on accumulation
          els.orb.classList.remove('pulse');
          void els.orb.offsetWidth;
          els.orb.classList.add('pulse');
          els.pendingNum.classList.remove('bump');
          void els.pendingNum.offsetWidth;
          els.pendingNum.classList.add('bump');
        }
        lastDisplayed = pending;
      }
    }

    els.remainingText.textContent = remaining.toLocaleString() + ' left';
    els.loggedText.textContent = state.loggedToday > 0
      ? state.loggedToday.toLocaleString() + ' logged'
      : '';

    if (remaining <= 0 && state.setupDone) {
      showScreen('done');
    }
  }

  function startEngine() {
    setInterval(() => {
      if (ensureFreshDay()) {
        lastDisplayed = -1;
        showScreen('start');
      }
      tick();
      render();
    }, 1500);
    tick();
    render({ silent: true });
  }

  function haptic(strength = 8) {
    try { if (navigator.vibrate) navigator.vibrate(strength); } catch {}
  }

  function animateNum(from, to, dur, onUpdate, onDone) {
    const start = performance.now();
    const delta = to - from;
    function step(now) {
      const t = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      onUpdate(from + delta * eased);
      if (t < 1) requestAnimationFrame(step);
      else if (onDone) onDone();
    }
    requestAnimationFrame(step);
  }

  // ---------------- Setup flow ----------------
  els.btnStart.addEventListener('click', () => {
    haptic();
    els.inputGoal.value = state.goal || 6000;
    showScreen('goal');
    setTimeout(() => els.inputGoal.focus({ preventScroll: true }), 650);
  });

  els.btnGoalNext.addEventListener('click', () => {
    const v = parseInt(els.inputGoal.value, 10);
    if (!v || v < 100) { els.inputGoal.focus(); return; }
    state.goal = v;
    els.inputSleep.value = state.sleep || '00:00';
    save();
    haptic();
    showScreen('sleep');
  });

  els.btnSleepNext.addEventListener('click', () => {
    const v = els.inputSleep.value;
    if (!v) { els.inputSleep.focus(); return; }
    state.sleep = v;
    state.setupDone = true;
    state.lastUpdate = Date.now();
    state.pending = 0;
    save();
    haptic();
    showScreen('main');
    render({ silent: true });
  });

  // ---------------- I did it ----------------
  function resetSheetState() {
    els.sheetInput.value = '';
    els.customArea.classList.remove('open');
  }

  els.btnDid.addEventListener('click', () => {
    haptic();
    resetSheetState();
    showSheet(els.sheetDid);
  });

  els.btnCustomToggle.addEventListener('click', () => {
    haptic(4);
    const opening = !els.customArea.classList.contains('open');
    els.customArea.classList.toggle('open', opening);
    if (opening) {
      setTimeout(() => els.sheetInput.focus({ preventScroll: true }), 320);
    }
  });

  els.sheetOverlay.addEventListener('click', hideSheets);

  // Core logging: separate from pending math.
  // pending decreases (clamped at 0); loggedToday gets the full amount.
  function logAmount(amount) {
    amount = Math.max(0, Math.floor(amount));
    if (!amount) return;

    const fromPending  = Math.floor(state.pending);
    const toPending    = Math.max(0, fromPending - amount);
    const loggedBefore = state.loggedToday;
    const remBefore    = Math.max(0, state.goal - loggedBefore);

    state.pending      = Math.max(0, state.pending - amount);
    state.loggedToday  = loggedBefore + amount;
    state.lastUpdate   = Date.now();
    save();
    hideSheets();
    haptic(14);

    // ripple
    const ripple = document.createElement('div');
    ripple.className = 'orb-ripple';
    els.orbWrap.appendChild(ripple);
    setTimeout(() => ripple.remove(), 1200);

    els.orb.classList.remove('dissolve'); void els.orb.offsetWidth;
    els.orb.classList.add('dissolve');

    // animate pending number down
    isAnimating = true;
    let lastShown = fromPending;
    animateNum(fromPending, toPending, 950, (v) => {
      const f = Math.floor(v);
      if (f !== lastShown) {
        lastShown = f;
        els.pendingNum.textContent = f > 0 ? '+' + f : '0';
        if (f === 0) els.pendingLabel.textContent = (state.goal - state.loggedToday) > 0 ? 'calm' : 'still';
      }
    }, () => {
      isAnimating = false;
      lastDisplayed = -1;
      render({ silent: true });
      if (state.goal - state.loggedToday <= 0) {
        setTimeout(() => showScreen('done'), 250);
      }
    });

    // animate remaining + logged counters
    const remTo = Math.max(0, state.goal - state.loggedToday);
    animateNum(remBefore, remTo, 900, (v) => {
      els.remainingText.textContent = Math.round(v).toLocaleString() + ' left';
    });
    animateNum(loggedBefore, state.loggedToday, 900, (v) => {
      els.loggedText.textContent = Math.round(v).toLocaleString() + ' logged';
    });
  }

  // Quick-add buttons fire immediately on tap
  els.quickButtons.forEach(b => b.addEventListener('click', () => {
    logAmount(parseInt(b.dataset.amount, 10));
  }));

  // Custom input confirm
  els.btnSheetConfirm.addEventListener('click', () => {
    const amt = parseInt(els.sheetInput.value, 10);
    if (!amt || amt <= 0) { hideSheets(); return; }
    logAmount(amt);
  });

  // ---------------- Settings ----------------
  els.btnSettings.addEventListener('click', () => {
    haptic();
    els.settingsGoal.value = state.goal;
    els.settingsSleep.value = state.sleep;
    showSheet(els.sheetSettings);
  });
  els.btnSettingsSave.addEventListener('click', () => {
    const g = parseInt(els.settingsGoal.value, 10);
    const s = els.settingsSleep.value;
    if (g && g >= 100) state.goal = g;
    if (s) state.sleep = s;
    save();
    haptic();
    hideSheets();
    lastDisplayed = -1;
    render({ silent: true });
  });

  // ---------------- Boot ----------------
  function boot() {
    ensureFreshDay();
    if (!state.setupDone) {
      showScreen('start');
    } else {
      showScreen('main');
      if (state.goal - state.loggedToday <= 0) showScreen('done');
    }
    startEngine();
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      if (ensureFreshDay()) {
        lastDisplayed = -1;
        showScreen('start');
      } else {
        tick(); render({ silent: true });
      }
    }
  });

  // dismiss keyboard on enter in setup inputs
  els.inputGoal.addEventListener('keydown', (e) => { if (e.key === 'Enter') els.btnGoalNext.click(); });
  els.inputSleep.addEventListener('keydown', (e) => { if (e.key === 'Enter') els.btnSleepNext.click(); });
  els.sheetInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') els.btnSheetConfirm.click(); });

  boot();

  // service worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
